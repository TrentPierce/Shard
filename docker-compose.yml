services:
  shard-daemon:
    build:
      context: .
      dockerfile: Dockerfile.daemon
    container_name: shard-daemon
    command: ["shard-daemon", "--control-port", "9091", "--tcp-port", "4001", "--webrtc-port", "9090", "--quic-port", "9092"]
    ports:
      - "9091:9091"
      - "4001:4001"
      - "4101:4101"
      - "9090:9090/udp"
      - "9092:9092/udp"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9091/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - shard-net
    restart: unless-stopped



  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: shard-prometheus
    profiles: ["monitoring"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    volumes:
      - ./deploy/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9095:9090"
    networks:
      - shard-net
    depends_on:
      shard-daemon:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.1
    container_name: shard-grafana
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deploy/monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    networks:
      - shard-net
    depends_on:
      - prometheus
    restart: unless-stopped

networks:
  shard-net:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data: