name: Release
on:
  push:
    tags: ['v*']
jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cd desktop/rust && cargo build --release
      - run: cd installers/linux && bash build-packages.sh
      - uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.tar.gz
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cd desktop/rust && cargo build --release
      # Sign if cert secrets present
      - name: Sign
        if: env.WIN_CODESIGN_CERT_BASE64 != ''
        run: python scripts/sign_release.py dist/shard-daemon.exe
        env:
          WIN_CODESIGN_CERT_BASE64: ${{ secrets.WIN_CODESIGN_CERT_BASE64 }}
      - run: python scripts/generate_release_manifest.py --artifact dist/shard-daemon.exe
      - uses: softprops/action-gh-release@v1
        with:
          files: dist/*
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cd desktop/rust && cargo build --release
      - run: cd installers/macos && bash build-dmg.sh
      - uses: softprops/action-gh-release@v1
        with:
          files: "*.dmg"
  publish-python-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd sdk/python && pip install build twine && python -m build && twine upload dist/*
        env:
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
