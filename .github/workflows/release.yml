name: Build and Release

on:
  push:
    tags: ["v*"]
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release
        run: |
          cd desktop/rust
          cargo build --release --bin shard-daemon

      - name: Package
        shell: bash
        run: |
          mkdir -p release
          cd desktop/rust
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/release/shard-daemon.exe ../../release/shard-daemon-${{ matrix.target }}.exe
            cp ../../installers/windows/start-shard.bat ../../release/start-shard-${{ matrix.target }}.bat
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            cp target/release/shard-daemon ../../release/shard-daemon-${{ matrix.target }}
            cp ../../installers/macos/start-shard.sh ../../release/start-shard-${{ matrix.target }}.sh
          else
            cp target/release/shard-daemon ../../release/shard-daemon-${{ matrix.target }}
            cp ../../installers/linux/start-shard.sh ../../release/start-shard-${{ matrix.target }}.sh
          fi

      - name: Determine Windows signing mode
        if: matrix.os == 'windows-latest' && github.event_name == 'release'
        id: windows_signing
        shell: powershell
        env:
          WIN_CODESIGN_CERT_BASE64: ${{ secrets.WIN_CODESIGN_CERT_BASE64 }}
          WIN_CODESIGN_CERT_PASSWORD: ${{ secrets.WIN_CODESIGN_CERT_PASSWORD }}
        run: |
          $hasCert = -not [string]::IsNullOrWhiteSpace($env:WIN_CODESIGN_CERT_BASE64)
          $hasPass = -not [string]::IsNullOrWhiteSpace($env:WIN_CODESIGN_CERT_PASSWORD)
          if ($hasCert -and $hasPass) {
            "should_sign=true" >> $env:GITHUB_OUTPUT
            Write-Host "Windows release mode: signed"
          } else {
            "should_sign=false" >> $env:GITHUB_OUTPUT
            Write-Host "Windows release mode: unsigned-supported preview"
          }

      - name: Sign Windows artifacts
        if: matrix.os == 'windows-latest' && github.event_name == 'release' && steps.windows_signing.outputs.should_sign == 'true'
        shell: powershell
        env:
          WIN_CODESIGN_CERT_BASE64: ${{ secrets.WIN_CODESIGN_CERT_BASE64 }}
          WIN_CODESIGN_CERT_PASSWORD: ${{ secrets.WIN_CODESIGN_CERT_PASSWORD }}
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WIN_CODESIGN_CERT_BASE64))
          $securePassword = ConvertTo-SecureString $env:WIN_CODESIGN_CERT_PASSWORD -AsPlainText -Force
          Import-PfxCertificate -FilePath $certPath -Password $securePassword -CertStoreLocation Cert:\CurrentUser\My | Out-Null

          $signtool = (Get-Command signtool.exe -ErrorAction Stop).Source
          Get-ChildItem -Path "release" -Filter "*.exe" | ForEach-Object {
            & $signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /a $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool sign failed for $($_.Name)" }
            & $signtool verify /pa /v $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool verify failed for $($_.Name)" }
          }

      - name: Mark unsigned Windows preview artifacts
        if: matrix.os == 'windows-latest' && github.event_name == 'release' && steps.windows_signing.outputs.should_sign == 'false'
        shell: bash
        run: |
          cat > release/windows-signing-status.txt <<'EOF'
          status: unsigned-supported-preview
          reason: trusted Authenticode certificate secrets not configured
          action: configure WIN_CODESIGN_CERT_BASE64 and WIN_CODESIGN_CERT_PASSWORD to enable signed GA artifacts
          EOF

      - name: Upload Release Asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
