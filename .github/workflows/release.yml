name: Build and Release

on:
  push:
    branches: [main]
  release:
    types: [created]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release
        run: |
          cd desktop/rust
          cargo build --release --bin shard-daemon

      - name: Package
        shell: bash
        run: |
          mkdir -p release
          cd desktop/rust
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/release/shard-daemon.exe ../../release/
          else
            cp target/release/shard-daemon ../../release/
          fi

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          draft: true
