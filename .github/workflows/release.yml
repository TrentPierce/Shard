name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libxdo-dev
      - run: cd desktop/rust && cargo build --release
      - run: |
          mkdir -p dist
          cp desktop/rust/target/release/shard-daemon dist/shard-daemon-linux-x86_64
          tar -C dist -czf dist/shard-daemon-linux-x86_64.tar.gz shard-daemon-linux-x86_64
      - run: python scripts/generate_release_manifest.py --out dist/release-manifest-linux.json --artifact dist/shard-daemon-linux-x86_64 --artifact dist/shard-daemon-linux-x86_64.tar.gz
      - uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/shard-daemon-linux-x86_64
            dist/*.tar.gz
            dist/release-manifest-linux.json
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cd desktop/rust && cargo build --release
      - run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item desktop/rust/target/release/shard-daemon.exe dist/shard-daemon-windows-x86_64.exe -Force
      # Sign if cert secrets present
      - name: Sign
        if: env.WIN_CODESIGN_CERT_BASE64 != ''
        run: python scripts/sign_release.py dist/shard-daemon-windows-x86_64.exe
        env:
          WIN_CODESIGN_CERT_BASE64: ${{ secrets.WIN_CODESIGN_CERT_BASE64 }}
      - run: python scripts/generate_release_manifest.py --out dist/release-manifest-windows.json --artifact dist/shard-daemon-windows-x86_64.exe
      - uses: softprops/action-gh-release@v1
        with:
          files: dist/*
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cd desktop/rust && cargo build --release
      - run: |
          mkdir -p dist
          cp desktop/rust/target/release/shard-daemon dist/shard-daemon-macos
          tar -C dist -czf dist/shard-daemon-macos.tar.gz shard-daemon-macos
      - run: python scripts/generate_release_manifest.py --out dist/release-manifest-macos.json --artifact dist/shard-daemon-macos --artifact dist/shard-daemon-macos.tar.gz
      - uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/shard-daemon-macos
            dist/shard-daemon-macos.tar.gz
            dist/release-manifest-macos.json
  publish-python-sdk:
    runs-on: ubuntu-latest
    env:
      TWINE_USERNAME: __token__
      TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: cd sdk/python && python -m pip install --upgrade pip build twine && python -m build
      - if: env.TWINE_PASSWORD != ''
        run: cd sdk/python && twine upload dist/*
