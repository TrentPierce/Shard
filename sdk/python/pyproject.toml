[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shard-client"
version = "0.6.6"
description = "Python SDK for the Shard distributed inference network"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "PyNaCl>=1.5.0",
  "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "responses>=0.25.0",
]

[tool.hatch.build.targets.wheel]
packages = ["shard"]
