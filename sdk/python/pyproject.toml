[build-system]
requires = ["setuptools>=68.0", "wheel", "setuptools-rust", "cmake"]
build-backend = "setuptools.build_meta"

[project]
name = "shard-inference"
version = "0.5.1"
description = "Python SDK for the Shard distributed inference network"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Shard Team", email = "sdk@shard.ai"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
async = ["aiohttp>=3.9.0"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23", "respx>=0.21", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["."]
include = ["shard*"]

[tool.mypy]
strict = true
