[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shard-sdk"
version = "0.4.4"
description = "Shard Network - Hybrid Distributed Inference SDK"
readme = "README.md"
license = {text = "BUSL-1.1 OR Apache-2.0"}
authors = [
    {name = "Shard Network Team", email = "team@shard.network"}
]
keywords = ["ai", "llm", "inference", "p2p", "decentralized", "distributed"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "License :: Other/Proprietary License :: Business Source License v1.1",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "black>=23.0",
    "ruff>=0.1.0",
]
all = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[project.urls]
Homepage = "https://github.com/ShardNetwork/Shard"
Documentation = "https://docs.shard.network"
Repository = "https://github.com/ShardNetwork/Shard"
Issues = "https://github.com/ShardNetwork/Shard/issues"

[tool.setuptools.packages.find]
where = ["desktop/python"]
include = ["inference*", "oracle_api*", "golden_ticket*", "bitnet*"]

[tool.setuptools.package-data]
"*" = ["*.txt", "*.md", "*.json"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
asyncio_mode = "auto"
