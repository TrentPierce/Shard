# Staging scrape profile for running Prometheus locally while scraping:
# - remote staging verifier daemon on EC2
# - local overflow router metrics

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: shard-daemon-staging
    metrics_path: /metrics
    static_configs:
      - targets: ["35.175.242.222:9091"]

  - job_name: overflow-router-local
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8080"]
