      - "34001:4001"
      - "39090:9090/udp"
      - "39092:9092/udp"
    depends_on: [node-a]
    networks: [pipeline-net]

  node-d:
    build:
      context: ../..
      dockerfile: Dockerfile.daemon
    profiles: ["five-node"]
    command:
      - shard-daemon
      - --control-port
      - "9091"
      - --telemetry-ws-port
      - "9191"
      - --tcp-port
      - "4001"
      - --webrtc-port
      - "9090"
      - --quic-port
      - "9092"
      - --model-id
      - "${MODEL_ID:-test-gguf}"
      - --layer-start
      - "${NODE_D_LAYER_START:-11}"
      - --layer-end
      - "${NODE_D_LAYER_END:-20}"
      - --bootstrap
      - /dns4/node-a/tcp/4001
    ports:
      - "49091:9091"
      - "44001:4001"
      - "49090:9090/udp"
      - "49092:9092/udp"
    depends_on: [node-a]
    networks: [pipeline-net]

  node-e:
    build:
      context: ../..
