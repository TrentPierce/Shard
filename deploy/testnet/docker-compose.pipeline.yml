      - --telemetry-ws-port
      - "9191"
      - --tcp-port
      - "4001"
      - --webrtc-port
      - "9090"
      - --quic-port
      - "9092"
      - --model-id
      - "${MODEL_ID:-test-gguf}"
      - --layer-start
      - "${NODE_E_LAYER_START:-21}"
      - --layer-end
      - "${NODE_E_LAYER_END:-30}"
      - --bootstrap
      - /dns4/node-a/tcp/4001
    ports:
      - "59091:9091"
      - "54001:4001"
      - "59090:9090/udp"
      - "59092:9092/udp"
