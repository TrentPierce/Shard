app = "shard-fly-bench"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.fly"

[env]
  SHARD_RELEASE_PROFILE = "fly-benchmark-2026-03-08"
  SHARD_REQUIRE_ENGINE_FOR_CONTRIBUTE = "true"
  SHARD_MESH_FORWARD_ENABLED = "true"
  SHARD_MESH_FORWARD_MAX_HOPS = "1"
  SHARD_MESH_FORWARD_PROBE_LIMIT = "4"
  SHARD_MESH_FORWARD_PROBE_TIMEOUT_MS = "600"
  SHARD_MESH_FORWARD_TIMEOUT_MS = "8000"
  SHARD_MESH_FORWARD_QUEUE_WEIGHT_MS = "120"
  SHARD_MESH_FORWARD_MIN_IMPROVEMENT_MS = "120"
  SHARD_MESH_FORWARD_LOCAL_QUEUE_TRIGGER = "2"
  SHARD_SCOUT_TIMEOUT_MS = "2000"
  SHARD_MAX_SCOUTS = "8"
  SHARD_ACCEPTANCE_THRESHOLD = "0.2"
  SHARD_HEARTBEAT_INTERVAL_SECONDS = "10"

[vm]
  size = "performance-4x"
  memory = "8gb"

[[mounts]]
  source = "shard_data"
  destination = "/data"

[checks]
  [checks.control]
    type = "http"
    port = 9091
    interval = "15s"
    timeout = "10s"
    method = "get"
    path = "/health"

[[services]]
  internal_port = 9091
  protocol = "tcp"

  [[services.ports]]
    port = 9091

[[services]]
  internal_port = 4001
  protocol = "tcp"

  [[services.ports]]
    port = 4001

[[services]]
  internal_port = 9090
  protocol = "udp"

  [[services.ports]]
    port = 9090

[[services]]
  internal_port = 9092
  protocol = "udp"

  [[services.ports]]
    port = 9092
