services:
  primary-inference:
    build:
      context: .
      dockerfile: integrations/Dockerfile.primary
    ports:
      - "8000:8000"
    environment:
      - BACKEND_NAME=primary
      - GPU_UTILIZATION_RATIO=0.92

  overflow-router:
    build:
      context: .
      dockerfile: integrations/Dockerfile.overflow
    ports:
      - "8080:8080"
    environment:
      - PRIMARY_URL=http://primary-inference:8000
      - SHARD_URL=http://shard-daemon:9091
      - GPU_THRESHOLD=0.85
      - CIRCUIT_BREAKER_ERROR_THRESHOLD=0.05
      - CIRCUIT_BREAKER_OPEN_DURATION=20
    depends_on:
      - primary-inference
      - shard-daemon

  shard-daemon:
    build:
      context: .
      dockerfile: integrations/Dockerfile.primary
    command: ["uvicorn", "integrations.primary_backend:app", "--host", "0.0.0.0", "--port", "9091"]
    ports:
      - "9091:9091"
    environment:
      - BACKEND_NAME=shard
      - GPU_UTILIZATION_RATIO=0.10
