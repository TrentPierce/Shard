# Shard Network - Nginx Reverse Proxy Configuration
# For Telemetry Dashboard and API on EC2
#
# Save to: /etc/nginx/sites-available/shard
# Symlink to: /etc/nginx/sites-enabled/shard
# Then run: sudo nginx -t && sudo systemctl reload nginx

# Upstream backends
upstream shard_api {
    server 127.0.0.1:9091;
}

upstream shard_dashboard {
    server 127.0.0.1:3000;
}

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Let's Encrypt certificate location (uncomment after obtaining cert)
    # location /.well-known/acme-challenge/ {
    #     root /var/www/html;
    # }

    return 301 https://$host$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # SSL Certificate (replace with your actual cert paths)
    # Using self-signed for initial setup - replace with Let's Encrypt or purchased cert
    ssl_certificate /etc/ssl/certs/shard-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/shard-selfsigned.key;

    # SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ─────────────────────────────────────────────────────────────
    # Telemetry Dashboard (Network Visualizer)
    # ─────────────────────────────────────────────────────────────
    location / {
        proxy_pass http://shard_dashboard;
        proxy_http_version 1.1;

        # Next.js specific headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (required for P2P real-time updates)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Cache static assets
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://shard_dashboard;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # ─────────────────────────────────────────────────────────────
    # Python Oracle API (OpenAI-compatible)
    # ─────────────────────────────────────────────────────────────
    location /v1/ {
        proxy_pass http://shard_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-running inference requests
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Buffering for streaming responses
        proxy_buffering off;
        proxy_cache off;
    }

    # ─────────────────────────────────────────────────────────────
    # Health Check Endpoints
    # ─────────────────────────────────────────────────────────────
    location /health {
        proxy_pass http://127.0.0.1:9091/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        
        # Short timeout for health checks
        proxy_connect_timeout 5s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
    }

    location /api/health {
        proxy_pass http://shard_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
    }

    # ─────────────────────────────────────────────────────────────
    # System Topology (for dashboard polling)
    # ─────────────────────────────────────────────────────────────
    location /topology {
        proxy_pass http://127.0.0.1:9091/topology;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /v1/ {
        proxy_pass http://127.0.0.1:9091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ─────────────────────────────────────────────────────────────
    # P2P WebSocket Support (if needed)
    # ─────────────────────────────────────────────────────────────
    location /ws/ {
        proxy_pass http://shard_api;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_read_timeout 86400;
    }

    # ─────────────────────────────────────────────────────────────
    # Static Assets (if serving from /static)
    # ─────────────────────────────────────────────────────────────
    location /static/ {
        alias /opt/shard/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# ─────────────────────────────────────────────────────────────────
# WebSocket-Only Server (for P2P WebRTC)
# ─────────────────────────────────────────────────────────────────
server {
    listen 4101 ssl http2;
    listen [::]:4101 ssl http2;
    server_name _;

    ssl_certificate /etc/ssl/certs/shard-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/shard-selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # P2P WebSocket traffic
    location / {
        proxy_pass http://127.0.0.1:4101;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}
